<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Checker</title>
    <link rel="icon" type="image/png" href="image.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Matrix canvas background */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Glowing Title */
        h1 {
            text-shadow: 0 0 5px #00ff99, 0 0 10px #00ff99, 0 0 20px #00ff99;
        }

        /* Glowing Buttons */
        button {
            box-shadow: 0 0 10px #00c6ff, 0 0 20px #00c6ff;
        }

        button:hover {
            box-shadow: 0 0 20px #0072ff, 0 0 40px #0072ff;
        }

        /* Glowing Inputs */
        textarea:focus, input:focus {
            box-shadow: 0 0 10px #00c6ff;
        }

        #urlDropdown:focus {
            box-shadow: 0 0 10px #007bff;
        }
    </style>
</head>
<body>
    <!-- 🌌 Matrix Background Canvas -->
    <canvas id="matrixCanvas"></canvas>

    <div class="container">
        <img src="image.png" alt="lock" class="lock-icon">
        <h1>AI Malicious Email & URL Detector</h1>

        <div class="card">
            <h2>📧 Check Email for Phishing</h2>

            <label for="modelSelect">Choose AI Model:</label>
            <div class="dropdown-container">
                <select id="modelSelect">
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo (Cheaper)</option>
                    <option value="gpt-4o">GPT-4o (More Accurate)</option>
                </select>
            </div>

            <textarea id="emailText" rows="4" placeholder="Enter email text..."></textarea>
            <button onclick="checkPhishing()">Analyze Email</button>
            <button onclick="getPhishingExplanation()">🧠 Explain Threat</button>
            <div id="explanationOutput" class="explanation-box hidden"></div>
        </div>

        <div class="card">
            <h2>🌐 Check URL for Malware</h2>

            <label for="urlDropdown">Select a URL:</label>
            <div class="dropdown-container">
                <select id="urlDropdown">
                    <option value="">Select a URL...</option>
                </select>
            </div>

            <label for="urlInput">Or enter a custom URL:</label>
            <input type="text" id="urlInput" placeholder="Enter URL...">
            <button onclick="checkMalware()">Analyze URL</button>
        </div>

        <div id="result-box" class="hidden">
            <p id="result"></p>
        </div>
    </div>

    <script>
        // Matrix Animation
        const canvas = document.getElementById("matrixCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "アァイィウヴエエオカガキギクグケゲコゴサザシジスズセゼソゾタダチッヂッツヅテデトドナニヌネノハバパヒビピフブプヘベペホボポマミムメモヤユヨラリルレロワンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = `${fontSize}px monospace`;
            ctx.shadowColor = "#0F0";
            ctx.shadowBlur = 8;
            ctx.fillStyle = "#0F0";

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                drops[i]++;
            }
        }

        setInterval(drawMatrix, 33);
    </script>

    <script src="script.js"></script>
</body>
</html>
